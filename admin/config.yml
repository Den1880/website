# Den 1880 content editor config (Sveltia CMS -- a drop-in, actively maintained
# GUI editor compatible with the same config format Decap/Netlify CMS used).
#
# Every page on den1880.co worth editing is wired up: plain-text copy blocks
# (content/<slug>.json, injected by assets/js/cms-loader.js -- or by an inline
# copy of the same script on the homepage), plus content photography and the
# homepage's hero video, both editable from the "Assets"/image fields below.
#
# Backend: saves commit directly to GitHub's "main" branch, which Netlify
# auto-deploys. Logging in requires the GitHub OAuth app + Netlify env vars
# described in netlify/functions/auth.mjs -- see PILOT_README.md at the repo
# root for the one-time setup Andrew needs to do in his GitHub/Netlify accounts.
backend:
  name: github
  repo: Den1880/website
  branch: main
  base_url: https://den1880.co
  auth_endpoint: /auth

# Where images uploaded through an "image" field (or the Assets tab) land.
media_folder: "assets/cms-uploads"
public_folder: "/assets/cms-uploads"

collections:
  - name: "homepage"
    label: "Homepage Text"
    files:
      - file: "content/homepage.json"
        label: "Homepage — Hero & Memberships Section"
        name: "homepage"
        fields:
          - label: "Hero — Headline"
            name: "hero_headline"
            widget: "text"
            hint: "Supports a light markup: *word* makes it italic, **word** gives it the gold highlight, and a line break in this box becomes a line break on the page."
          - label: "Hero video — Vimeo video ID"
            name: "hero_video_id"
            widget: "string"
            hint: "The numeric ID from the Vimeo video's URL, e.g. the \"1197825413\" in vimeo.com/1197825413. Only the ID -- the autoplay/loop/mute settings already on the page are kept as-is."
          - label: "Hero — small tag above the headline"
            name: "hero_eyebrow"
            widget: "string"
            hint: "Shows as \"EVENTS · WORK · WELLNESS\" above the big headline."
          - label: "Hero — line under the headline"
            name: "hero_subhead"
            widget: "text"
          - label: "Memberships section — small tag above the heading"
            name: "paths_eyebrow"
            widget: "string"
          - label: "Memberships section — heading"
            name: "paths_headline"
            widget: "string"
          - label: "Memberships section — line under the heading"
            name: "paths_subhead"
            widget: "text"
          - label: "Review under the hero — the quote"
            name: "hero_proof_quote"
            widget: "text"
            hint: "One real Google review, word for word. Trim with … if it is too long; never reword it."
          - label: "Review under the hero — who said it"
            name: "hero_proof_name"
            widget: "string"
          - label: "Review under the hero — small tag beside the name"
            name: "hero_proof_tag"
            widget: "string"
            hint: "A few words saying who this person is, e.g. \"Remote software engineer\"."
          - label: "Photo section — small tag above the heading"
